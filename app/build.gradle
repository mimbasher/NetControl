plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alex.netcontrol'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alex.netcontrol'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
