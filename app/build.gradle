plugins {
    id 'com.android.application'
}

// Release signing. CI decodes the keystore from a secret into release.keystore
// at the repo root and passes the passwords as environment variables. Local
// builds without those simply fall back to the debug key.
def ksPath = System.getenv('KEYSTORE_FILE') ?: 'release.keystore'
def ksFile = rootProject.file(ksPath)
def canSign = ksFile.exists() && System.getenv('KEYSTORE_PASSWORD') != null

android {
    namespace 'com.alex.netcontrol'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alex.netcontrol'
        minSdk 26
        targetSdk 34
        // Monotonic in CI so every release can update the one before it.
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '4')
        versionName = System.getenv('VERSION_NAME') ?: '2.1'
    }

    // Two flavours, because the updater needs INTERNET and the whole point of
    // this app is not having it.
    //   foss  - no network permission at all. For F-Droid and IzzyOnDroid,
    //           where the repo client already does the updating, so an in-app
    //           updater would be redundant anyway.
    //   full  - for APKs handed out from GitHub Releases, where nothing else
    //           is watching for new versions. Adds INTERNET and the ability to
    //           install a package, and nothing else.
    // Each flavour supplies its own Updater with the same signature, so
    // MainActivity does not know or care which one it is talking to.
    flavorDimensions += 'distribution'

    productFlavors {
        foss {
            dimension 'distribution'
            buildConfigField 'boolean', 'HAS_UPDATER', 'false'
        }
        full {
            dimension 'distribution'
            buildConfigField 'boolean', 'HAS_UPDATER', 'true'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (canSign) {
            release {
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'netcontrol'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // Kept off on purpose: MainActivity reaches Shizuku.newProcess by
            // reflection, which R8 would rename and break.
            minifyEnabled false
            shrinkResources false
            if (canSign) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
